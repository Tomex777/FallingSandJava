name: Elementum Android build

on:
  push:
    branches:
      - elementum
  workflow_dispatch:

concurrency:
  group: elementum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Elementum debug APK
        run: |
          chmod +x gradlew
          ./gradlew :core:compileJava :android:assembleDebug --no-daemon --stacktrace

      - name: Upload Elementum APK
        uses: actions/upload-artifact@v4
        with:
          name: elementum-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error

  runtime-smoke:
    needs: build-android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Elementum APK
        uses: actions/download-artifact@v4
        with:
          name: elementum-debug-apk
          path: android/build/outputs/apk/debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Launch and exercise Elementum
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p android/build/runtime-smoke
            adb install -r android/build/outputs/apk/debug/android-debug.apk
            adb logcat -c
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell am force-stop com.tomex.elementum
            adb shell am start -W -n com.tomex.elementum/com.gdx.cellular.AndroidLauncher
            sleep 5
            adb shell input tap 510 190 || true
            sleep 3
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-startup.png
            adb shell input tap 332 284
            sleep 1
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-material-picker-solids.png
            adb shell input swipe 300 220 300 95 500
            sleep 1
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-material-picker-liquids.png
            adb shell input swipe 300 220 300 95 500
            sleep 1
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-material-picker-gases-energy.png
            adb shell input tap 332 284
            adb shell input tap 178 284
            adb shell input swipe 330 70 330 160 500
            sleep 1
            adb shell input tap 259 284
            adb shell input swipe 450 60 450 145 500
            sleep 2
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-interactions.png

            # Save the populated scene before clearing it so load can be checked.
            adb shell input keyevent KEYCODE_K
            sleep 1
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-save-dialog.png
            adb shell input text elementum_qa
            sleep 1
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-save-name-entered.png
            adb shell input tap 240 218
            sleep 1
            adb shell run-as com.tomex.elementum ls -l files/save > android/build/runtime-smoke/saves.txt
            adb shell run-as com.tomex.elementum test -s files/save/elementum_qa.ser

            # Exercise pause/resume and clear, then confirm the saved scene reloads.
            adb shell input tap 485 284
            sleep 1
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-paused.png
            adb shell input tap 485 284
            sleep 1
            adb shell input tap 545 284
            sleep 1
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-cleared.png
            adb shell input keyevent KEYCODE_L
            sleep 1
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-load-dialog.png
            adb shell input text elementum_qa
            adb shell input keyevent KEYCODE_ENTER
            sleep 2
            adb exec-out screencap -p > android/build/runtime-smoke/elementum-loaded.png

            adb logcat -d > android/build/runtime-smoke/logcat.txt
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" > android/build/runtime-smoke/window.txt || true
            test -n "$(adb shell pidof com.tomex.elementum)"
            ! grep -E "FATAL EXCEPTION|Process: com\.tomex\.elementum.*has died" android/build/runtime-smoke/logcat.txt

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elementum-runtime-smoke
          path: android/build/runtime-smoke
          if-no-files-found: warn
